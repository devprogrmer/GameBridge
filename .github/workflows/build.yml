name: build
on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Download modules
        run: go mod download
      - name: Go fmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: Go tests
        run: go test ./...
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n install-panel.sh
          bash -n uninstall.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/gamebridge.py
  build:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Download modules
        run: go mod download
      - name: Build all GameBridge binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for component in core panel agent; do
            case "$component" in
              core) pkg="./cmd/gamebridge-core" ;;
              panel) pkg="./cmd/gamebridge-panel" ;;
              agent) pkg="./cmd/gamebridge-agent" ;;
            esac
            binary="gamebridge-${component}-linux-${{ matrix.arch }}"
            go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${binary}" "$pkg"
            (cd dist && sha256sum "${binary}" > "${binary}.sha256")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gamebridge-linux-${{ matrix.arch }}
          path: |
            dist/gamebridge-*-linux-${{ matrix.arch }}
            dist/gamebridge-*-linux-${{ matrix.arch }}.sha256
      - name: Release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gamebridge-*-linux-${{ matrix.arch }}
            dist/gamebridge-*-linux-${{ matrix.arch }}.sha256
          body: |
            ## GameBridge ${{ github.ref_name }}
            Multi-transport gaming tunnel + Web Control Plane.

            ### Core
            ```bash
            curl -fsSL https://raw.githubusercontent.com/devprogrmer/GameBridge/${{ github.ref_name }}/install.sh | sudo bash
            ```

            ### Web Panel + Agent
            ```bash
            curl -fsSL https://raw.githubusercontent.com/devprogrmer/GameBridge/${{ github.ref_name }}/install-panel.sh | sudo bash
            ```
