name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Go tests
        run: go test ./...

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Python syntax
        run: python3 -m py_compile scripts/gamebridge.py

  build:
    needs: quality
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          binary="gamebridge-core-linux-${{ matrix.arch }}"

          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/${binary}" \
            ./cmd/gamebridge-core

          (
            cd dist
            sha256sum "${binary}" > "${binary}.sha256"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: gamebridge-linux-${{ matrix.arch }}
          path: |
            dist/gamebridge-core-linux-${{ matrix.arch }}
            dist/gamebridge-core-linux-${{ matrix.arch }}.sha256

      - name: Release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gamebridge-core-linux-${{ matrix.arch }}
            dist/gamebridge-core-linux-${{ matrix.arch }}.sha256
          body: |
            ## GameBridge ${{ github.ref_name }}

            Linux binaries for AMD64 and ARM64.

            Each binary includes a matching SHA-256 checksum file.

            ### Quick install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/devprogrmer/GameBridge/${{ github.ref_name }}/install.sh | sudo bash
            ```

            The installer detects the CPU architecture automatically and verifies
            the downloaded core binary before installation.
