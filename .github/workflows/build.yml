name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/gamebridge-core-linux-${{ matrix.arch }} \
            ./cmd/gamebridge-core

      - uses: actions/upload-artifact@v4
        with:
          name: gamebridge-linux-${{ matrix.arch }}
          path: dist/gamebridge-core-linux-${{ matrix.arch }}

      - name: Release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gamebridge-core-linux-${{ matrix.arch }}
