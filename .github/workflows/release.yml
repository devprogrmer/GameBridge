name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Build release binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for component in core panel agent; do
            binary="gamebridge-${component}-linux-${{ matrix.arch }}"
            go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${binary}" "./cmd/gamebridge-${component}"
            (cd dist && sha256sum "${binary}" > "${binary}.sha256")
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true