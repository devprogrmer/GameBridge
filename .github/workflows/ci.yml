name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test -count=1 ./...
      - name: Verify module files
        run: |
          cp go.mod /tmp/go.mod
          cp go.sum /tmp/go.sum
          go mod tidy
          cmp -s go.mod /tmp/go.mod
          cmp -s go.sum /tmp/go.sum

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Race-sensitive packages
        run: go test -race -count=1 ./internal/panel ./internal/agent ./internal/secure ./internal/stats/...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIN_COVERAGE: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Generate coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./internal/panel ./internal/agent ./internal/secure ./internal/stats/...
      - name: Enforce coverage floor
        shell: bash
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')"
          echo "Total coverage: ${total}%"
          awk -v got="$total" -v min="$MIN_COVERAGE" 'BEGIN { if (got+0 < min+0) exit 1 }'
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14