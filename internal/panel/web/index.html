<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameBridge</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="toast"></div>
<section id="auth-screen" class="auth-screen"><div class="auth-card"><div class="brand big"><span class="brand-mark">G</span><div><b>GameBridge</b><small>Gaming Network Control Plane</small></div></div><div id="setup-box" class="hidden"><h1>راه‌اندازی اولیه</h1><p>حساب Owner را بساز.</p><input id="setup-user" placeholder="نام کاربری" value="admin"><input id="setup-pass" type="password" placeholder="رمز عبور حداقل ۱۰ کاراکتر"><button class="primary wide" onclick="setupOwner()">ساخت Owner</button></div><div id="login-box" class="hidden"><h1>ورود به پنل</h1><input id="login-user" placeholder="نام کاربری"><input id="login-pass" type="password" placeholder="رمز عبور"><input id="login-totp" placeholder="کد 2FA (اختیاری)"><button class="primary wide" onclick="login()">ورود</button></div></div></section>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand"><span class="brand-mark">G</span><div><b>GameBridge</b><small id="role-label">Control Plane</small></div></div><nav id="nav"><button data-page="dashboard" class="active">◈ داشبورد</button><button data-page="users">♟ کاربران</button><button data-page="plans">▤ پلن‌ها</button><button data-page="inbounds">⇢ Inbounds</button><button data-page="nodes">◉ نودها</button><button data-page="tunnels">⇄ GameBridge Tunnels</button><button data-page="forwards">↪ پورت فوروارد</button><button data-page="logs">≡ لاگ‌ها</button><button data-page="audit">⌁ Audit</button><button data-page="admins">♜ ادمین‌ها</button><button data-page="settings">⚙ تنظیمات</button></nav><div class="sidebar-footer"><span id="current-user"></span><button onclick="logout()">خروج</button></div></aside><main><header><div><h2 id="page-title">داشبورد</h2><p id="page-subtitle">وضعیت شبکه GameBridge</p></div><div class="header-actions"><button onclick="syncTraffic()">Sync Traffic</button><button class="primary" id="page-action">+ جدید</button></div></header><div id="content"></div></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><h2 id="modal-title"></h2><div id="modal-body"></div></div></div><script src="/app.js"></script><script src="/phase2.js"></script></body></html>
